# .github/workflows/needs-human-review.yml
#
# Runs after your CI workflow finishes. GitHub runs this file from the
# default branch, never from the PR, so a PR cannot change the rules it is
# judged by.
name: Needs Human Review
on:
  workflow_run:
    workflows: [CI] # the name of every workflow that must be green
    types: [completed]

permissions:
  contents: write # merge (autonomous mode only; read is enough for shadow)
  pull-requests: write # comment, labels
  issues: write # labels are issue labels
  statuses: write # the human-review status (advisory, autonomous)
  checks: read # is CI green?
  actions: read # read the workflow run

concurrency:
  group: needs-human-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          # Fork PRs need this since checkout v7. The action reads the files, never runs them.
          allow-unsafe-pr-checkout: true
      - uses: alfonsograziano/needs-human-review@v1
        with:
          mode: shadow
          # The model key, whatever the harness. The harness passes it to the agent.
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          # The coding agent that runs the review, the model, and the other
          # harness settings. Leave any of them out to get the harness's default.
          harness: opencode # or claude-code
          model: opencode/deepseek-v4.1-flash
          harness-settings: |
            version: 2.2.5
          # For Claude Code with the same OpenCode key, through OpenCode's endpoint.
          # The model can be any one your OpenCode workspace has turned on:
          # harness: claude-code
          # model: claude-sonnet-5-5
          # harness-settings: |
          #   base-url: https://opencode.ai/inference/anthropic
          # With an Anthropic key, leave out base-url.
          protected-paths: |
            src/payments/**
            **/migrations/**
            *.tf
          max-lines-changed: 400
