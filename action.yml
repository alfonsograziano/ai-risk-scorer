name: Needs Human Review
description: Answers one question for every pull request, does it need a human review? Rules you control first, AI second.
author: Alfonso Graziano
branding:
  icon: shield
  color: green

inputs:
  mode:
    description: shadow (comment only), advisory (labels and a status), or autonomous (merges safe PRs)
    default: shadow
  harness:
    description: |
      Coding agent that runs the review: claude-code, codex or opencode
    default: claude-code
  model:
    description: |
      Model that runs the review, in the harness's format: provider/model for
      opencode (opencode/deepseek-v4.1-flash), a model name for claude-code
      (claude-sonnet-5-5) and codex (gpt-6.1-sol). Empty uses the harness's default.
    default: ''
  harness-settings:
    description: |
      Other settings for the harness, one "key: value" per line: version (the
      release to install) for every harness; effort, base-url, provider
      (anthropic, bedrock, vertex, foundry), auth (x-api-key, bearer, oauth),
      region and project for claude-code; effort and base-url for codex. "model" may also go here instead of the model input.
      Unset keys use the harness's defaults. See the README.
    default: ''
  api-key:
    description: |
      Key for the model, whatever the harness. The harness passes it to the agent
      in the variable that agent reads (OPENCODE_API_KEY, ANTHROPIC_API_KEY,
      OPENAI_API_KEY...).
      Pass it from a secret. Empty uses the agent's own variables from env.
    default: ''
  github-token:
    description: Token for comments, labels, the status and the merge
    default: ${{ github.token }}
  protected-paths:
    description: Globs that always need a human, one per line
    default: ''
  self-protected-paths:
    description: Extra paths added to the always-on self-protected list, one per line
    default: ''
  max-lines-changed:
    description: Size limit in changed lines. 0 is off.
    default: '0'
  max-files-changed:
    description: Size limit in changed files. 0 is off.
    default: '0'
  generated-paths:
    description: Extra globs for generated files (not counted for size, patches not reviewed), one per line
    default: ''
  generated-defaults:
    description: Use the built-in generated-files list (lock files, minified files, snapshots, dist)
    default: 'true'
  system-prompt:
    description: Replaces the default prompt completely (inline text)
    default: ''
  system-prompt-file:
    description: Replaces the default prompt completely (file in the repo, read from the base branch)
    default: ''
  custom-instructions:
    description: Added after the system prompt (inline text)
    default: ''
  custom-instructions-file:
    description: Added after the system prompt (file in the repo, read from the base branch)
    default: ''
  max-risk-to-merge:
    description: Highest risk that may merge, low or medium
    default: low
  min-confidence:
    description: Fewest stars (1 to 5) that may merge
    default: '4'
  slice-max-tokens:
    description: Patch plus file size per slice, in estimated tokens
    default: '40000'
  max-slices:
    description: Cost cap. More slices means a human must check. 0 is no limit.
    default: '25'
  max-parallel:
    description: Slice reviews run at the same time
    default: '4'
  slice-timeout-minutes:
    description: Hard limit for one reviewer run
    default: '10'
  timeout-minutes:
    description: Hard limit for the whole AI step
    default: '30'
  required-checks:
    description: Check names that must exist and be green, one per line
    default: ''
  ci-wait-minutes:
    description: How long to wait for checks that are still running, such as GitHub App checks
    default: '10'
  base-branches:
    description: Base branches to act on, one per line. Default is the repo's default branch.
    default: ''
  allow-forks:
    description: Let fork PRs reach the AI step
    default: 'false'
  skip-label:
    description: Label that always sends the PR to a human
    default: needs-human-review:always
  merge-method:
    description: squash, merge or rebase
    default: squash
  comment:
    description: Post the sticky PR comment
    default: 'true'

outputs:
  decision:
    description: merged, safe, needs_human or skipped
    value: ${{ steps.score.outputs.decision }}
  risk:
    description: low, medium or high, empty when unknown
    value: ${{ steps.score.outputs.risk }}
  confidence:
    description: 1 to 5 stars, empty when unknown
    value: ${{ steps.score.outputs.confidence }}
  stopped-at:
    description: The gate that stopped the run, ai, error or skipped
    value: ${{ steps.score.outputs.stopped-at }}
  verdict-json:
    description: The combined verdict as JSON
    value: ${{ steps.score.outputs.verdict-json }}

runs:
  using: composite
  steps:
    - name: Set up Node 26
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Check the config
      id: setup
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/setup.ts"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_HARNESS: ${{ inputs.harness }}
        INPUT_HARNESS_SETTINGS: ${{ inputs.harness-settings }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PROTECTED_PATHS: ${{ inputs.protected-paths }}
        INPUT_SELF_PROTECTED_PATHS: ${{ inputs.self-protected-paths }}
        INPUT_MAX_LINES_CHANGED: ${{ inputs.max-lines-changed }}
        INPUT_MAX_FILES_CHANGED: ${{ inputs.max-files-changed }}
        INPUT_GENERATED_PATHS: ${{ inputs.generated-paths }}
        INPUT_GENERATED_DEFAULTS: ${{ inputs.generated-defaults }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system-prompt }}
        INPUT_SYSTEM_PROMPT_FILE: ${{ inputs.system-prompt-file }}
        INPUT_CUSTOM_INSTRUCTIONS: ${{ inputs.custom-instructions }}
        INPUT_CUSTOM_INSTRUCTIONS_FILE: ${{ inputs.custom-instructions-file }}
        INPUT_MAX_RISK_TO_MERGE: ${{ inputs.max-risk-to-merge }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_SLICE_MAX_TOKENS: ${{ inputs.slice-max-tokens }}
        INPUT_MAX_SLICES: ${{ inputs.max-slices }}
        INPUT_MAX_PARALLEL: ${{ inputs.max-parallel }}
        INPUT_SLICE_TIMEOUT_MINUTES: ${{ inputs.slice-timeout-minutes }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_REQUIRED_CHECKS: ${{ inputs.required-checks }}
        INPUT_CI_WAIT_MINUTES: ${{ inputs.ci-wait-minutes }}
        INPUT_BASE_BRANCHES: ${{ inputs.base-branches }}
        INPUT_ALLOW_FORKS: ${{ inputs.allow-forks }}
        INPUT_SKIP_LABEL: ${{ inputs.skip-label }}
        INPUT_MERGE_METHOD: ${{ inputs.merge-method }}
        INPUT_COMMENT: ${{ inputs.comment }}

    - name: Install OpenCode
      if: steps.setup.outputs.harness == 'opencode'
      shell: bash
      env:
        OPENCODE_VERSION: ${{ steps.setup.outputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported CPU $(uname -m)"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/opencode"
        mkdir -p "$dir"
        curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-${arch}.tar.gz" | tar -xz -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/opencode" --version

    - name: Install Claude Code
      if: steps.setup.outputs.harness == 'claude-code'
      shell: bash
      env:
        CLAUDE_CODE_VERSION: ${{ steps.setup.outputs.version }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/claude-code"
        mkdir -p "$dir"
        # Install from inside $dir, so an .npmrc in the PR checkout cannot change the registry.
        cd "$dir"
        npm install --prefix "$dir" --no-audit --no-fund --loglevel=error "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        echo "$dir/node_modules/.bin" >> "$GITHUB_PATH"
        "$dir/node_modules/.bin/claude" --version

    - name: Install Codex
      if: steps.setup.outputs.harness == 'codex'
      shell: bash
      env:
        CODEX_VERSION: ${{ steps.setup.outputs.version }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/codex"
        mkdir -p "$dir"
        # Install from inside $dir, so an .npmrc in the PR checkout cannot change the registry.
        cd "$dir"
        npm install --prefix "$dir" --no-audit --no-fund --loglevel=error "@openai/codex@${CODEX_VERSION}"
        echo "$dir/node_modules/.bin" >> "$GITHUB_PATH"
        "$dir/node_modules/.bin/codex" --version

    - name: Score the pull request
      id: score
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.ts"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_HARNESS: ${{ inputs.harness }}
        INPUT_HARNESS_SETTINGS: ${{ inputs.harness-settings }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PROTECTED_PATHS: ${{ inputs.protected-paths }}
        INPUT_SELF_PROTECTED_PATHS: ${{ inputs.self-protected-paths }}
        INPUT_MAX_LINES_CHANGED: ${{ inputs.max-lines-changed }}
        INPUT_MAX_FILES_CHANGED: ${{ inputs.max-files-changed }}
        INPUT_GENERATED_PATHS: ${{ inputs.generated-paths }}
        INPUT_GENERATED_DEFAULTS: ${{ inputs.generated-defaults }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system-prompt }}
        INPUT_SYSTEM_PROMPT_FILE: ${{ inputs.system-prompt-file }}
        INPUT_CUSTOM_INSTRUCTIONS: ${{ inputs.custom-instructions }}
        INPUT_CUSTOM_INSTRUCTIONS_FILE: ${{ inputs.custom-instructions-file }}
        INPUT_MAX_RISK_TO_MERGE: ${{ inputs.max-risk-to-merge }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_SLICE_MAX_TOKENS: ${{ inputs.slice-max-tokens }}
        INPUT_MAX_SLICES: ${{ inputs.max-slices }}
        INPUT_MAX_PARALLEL: ${{ inputs.max-parallel }}
        INPUT_SLICE_TIMEOUT_MINUTES: ${{ inputs.slice-timeout-minutes }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_REQUIRED_CHECKS: ${{ inputs.required-checks }}
        INPUT_CI_WAIT_MINUTES: ${{ inputs.ci-wait-minutes }}
        INPUT_BASE_BRANCHES: ${{ inputs.base-branches }}
        INPUT_ALLOW_FORKS: ${{ inputs.allow-forks }}
        INPUT_SKIP_LABEL: ${{ inputs.skip-label }}
        INPUT_MERGE_METHOD: ${{ inputs.merge-method }}
        INPUT_COMMENT: ${{ inputs.comment }}

    - name: Keep the verdict record
      if: always() && steps.score.outputs.record-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.score.outputs.record-name }}-attempt${{ github.run_attempt }}
        path: ${{ steps.score.outputs.record-path }}
        if-no-files-found: ignore
